name: Release

run-name: "Mote ${{ inputs.version }} · ${{ inputs.channel }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        default: stable
      version:
        description: "Base version, e.g. 0.1.0 (no channel suffix)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          BASE_VERSION="${{ github.event.inputs.version }}"
          case "$CHANNEL" in
            beta)   SUFFIX="-beta.${GITHUB_RUN_NUMBER}";  DISPLAY="Mote Beta";  BUNDLE="com.mote.app.beta";  PRERELEASE=true ;;
            stable) SUFFIX="";                            DISPLAY="Mote";       BUNDLE="com.mote.app";       PRERELEASE=false ;;
          esac
          FULL="${BASE_VERSION}${SUFFIX}"
          {
            echo "full_version=${FULL}"
            echo "display_name=${DISPLAY}"
            echo "bundle_id=${BUNDLE}"
            echo "dmg_file=Mote-${FULL}.dmg"
            echo "zip_file=Mote-${FULL}.zip"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64}" ]; then
            echo "::error::SIGNING_P12_BASE64 secret not set. See docs/signing.md."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Mote.xcodeproj -scheme Mote -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Mote Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="$DISPLAY_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package DMG and ZIP
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" "dist/${DMG_FILE}"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${ZIP_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Mote-${{ steps.meta.outputs.full_version }}
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ steps.meta.outputs.full_version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          TAG="v${FULL}"
          NOTES="$(mktemp)"
          {
            echo "# Mote ${FULL}"
            echo
            echo "Lite macOS launcher — modified from [Tinycast](https://github.com/abue-ammar/tinycast). AGPL-3.0."
            echo
            echo "## Install"
            echo
            echo "1. Download \`${DMG_FILE}\`"
            echo "2. Open it and drag **Mote** to Applications"
            echo "3. Clear quarantine once:"
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine "/Applications/Mote.app"'
            echo '```'
          } > "$NOTES"
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            "dist/${DMG_FILE}" \
            "dist/${ZIP_FILE}" \
            --title "Mote ${FULL}" \
            --notes-file "$NOTES" \
            $PRERELEASE_FLAG
